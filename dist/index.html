<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Game</title>
</head>
<body id="fondo" >
    
    <div class="container mb-4 mt-3">
        <h1 class="text-center"> Dragon GAME</h1>
        <hr class="text-danger mb-3 ">
        
        <div class="row justify-content-around" id="seleccion_jugadores">
            <div class="col-md-5" id="jugador1">
                
                    <label for="username1" >Ingresa nombre de jugador_1</label>
                    <input type="text" id="username_py1" class="form-control mt-2 mb-3" style="color: aliceblue;" placeholder="Player 1">

                
                <div class="row mb-3" id="selecion_personaje1">
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/01.png" alt="personaje1" class="img-fluid mt-1 mb-1" title="Veguito">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/03.png" alt="personaje2" class="img-fluid mt-1 mb-1" title="Trunks">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/05.png" alt="personaje3" class="img-fluid mt-1 mb-1" title="Goku">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/06.png" alt="personaje4" class="img-fluid mt-1 mb-1" title="Gohan">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-danger rounded-circle">
                            <img src="./public/img/seleccion/09.png" alt="personaje5" class="img-fluid mt-1 mb-1" title="Bills">
                        </button>
                    </div>
                </div>
                <button type="button" id="btn_py1" class="btn btn-danger w-100 mb-3" >Aceptar</button>
            </div>
            <div class="col-md-5" id="jugador2">
                <label for="username2" >Ingresa nombre de jugador_2</label>
                <input type="text" id="username_py2" class="form-control mt-2 mb-3" style="color: aliceblue;" placeholder="Player 2">
                
                <div class="row mb-3" id="selecion_personaje2">
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/04.png" alt="personaje6" class="img-fluid mt-1 mb-1" title="Pikoro">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/02.png" alt="personaje7" class="img-fluid mt-1 mb-1" title="Veguetta">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/08.png" alt="personaje8" class="img-fluid mt-1 mb-1" title="Cell">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle">
                            <img src="./public/img/seleccion/07.png" alt="personaje9" class="img-fluid mt-1 mb-1" title="Gogueta">
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-primary rounded-circle ">
                            <img src="./public/img/seleccion/10.png" alt="personaje10" class="img-fluid mt-1 mb-1" title="Zamasu">
                        </button>
                    </div>
                </div>
                <button type="button" id="btn_py2" class="btn btn-primary w-100 mb-3" >Aceptar</button>
            </div>
        </div>

        <div class="row justify-content-around d-none" id="batalla">
            <div class="col-md-5">
                <div class="row ">
                    <div class="col-3">
                    <h2 id="nombre_personaje1"></h2>
                    <p id="username1"></p>
                    
                    </div>
                    <div class="col-3 mb-1 d-none" id="vict1">
                        <div class="card"  style="background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); color: rgb(237, 245, 19); width: 15rem;">
                            <div class="card-body">
                                
                                <h2 id="victorias1"></h2>
                                <!-- <p style="font-size: 20px; color: azure;" id="victorias1"></p> -->
                            </div>
                        </div>

                        
                    </div>
                </div>
                
                <hr class="text-danger">
                <div class="row">
                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Example with label" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                            <div id="vida1" class="progress-bar bg-success" role="progressbar" style="width: 100%">1000</div>
                        </div>
                    </div>
                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Example with label" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                            <div id="ki1" class="progress-bar bg-info" role="progressbar" style="width: 100%">1000</div>
                        </div>
                    </div>
                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Example with label" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                            <div id="energia1" class="progress-bar bg-warning" role="progressbar" style="width: 100%">1000</div>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-around mt-2 text-center">
                    <div class="col-md-12 text-center">
                        <img class="mx-auto" width="40%" id="img_personaje1" src="" alt="">
                    </div>
                </div>
                <div class="row justify-content-around mt-2">
                    
                        <button id="btn_atk_basico1" class="btn btn-primary mb-3" style="width: 40%">ATK Basico</button>
                        <button id="btn_atk_especial1" class="btn btn-danger mb-3" style="width: 40%">ATK Especial</button>
                        
                </div>
                <div class="row justify-content-around mt-2">
                        
                        <button id="btn_carga1" class="btn btn-warning mb-3" style="width: 40%">Carga de energia y ki</button>
                        <button id="btn_semillas_ermt1" class="btn btn-success mb-3" style="width: 40%">Semillas de ermitaño (3)</button>
                </div>
            </div>
            <div class="col-md-2 align-self-center">
                <h2 class="text-center display-3">VS</h2>
                <div class="row  justify-content-around mt-4 md-5 d-none" id="volver_juego">
                    <button id="btn_juegar" class="btn btn-warning mb-3" style="width: 50%">Nueva Partida</button>
                </div>
                <div class="row  justify-content-around mt-4 md-5 d-none" id="revancha">
                    <button id="btn_revancha" class="btn btn-danger mb-3" style="width: 50%">Revancha</button>
                </div>
            </div>
            <div class="col-md-5">
                <div class="row ">
                    <div class="col-3">
                    <h2 id="nombre_personaje2"></h2>
                    <p id="username2"></p>
                    
                    </div>
                    <div class="col-3 mb-1 d-none" id="vict2">
                        <div class="card"  style="background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); color: rgb(237, 245, 19); width: 15rem;">
                            <div class="card-body">
                                
                                <h2 id="victorias2"></h2>
                                <!-- <p style="font-size: 20px; color: azure;" id="victorias1"></p> -->
                            </div>
                        </div>

                        
                    </div>
                </div>
                
                <hr class="text-danger">
                <div class="row">
                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Example with label" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                            <div id="vida2" class="progress-bar bg-success" role="progressbar" style="width: 100%">1000</div>
                        </div>
                    </div>
                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Example with label" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                            <div id="ki2" class="progress-bar bg-info" role="progressbar" style="width: 100%">1000</div>
                        </div>
                    </div>
                    <div class="col-12 mb-3">
                        <div class="progress" aria-label="Example with label" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                            <div id="energia2" class="progress-bar bg-warning" role="progressbar" style="width: 100%">1000</div>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-around mt-2 text-center">
                    <div class="col-md-12 text-center">

                        <img class="mx-auto" width="40%" id="img_personaje2" src="" alt="">
                    </div>
                </div>
                <div class="row justify-content-around mt-2">
                    
                        <button id="btn_atk_basico2" class="btn btn-primary mb-3" style="width: 40%">ATK Basico</button>
                        <button id="btn_atk_especial2" class="btn btn-danger mb-3" style="width: 40%">ATK Especial</button>
                        
                        
                        
                    </div>
                <div class="row justify-content-around mt-2">
                        
                        <button id="btn_carga2" class="btn btn-warning mb-3" style="width: 40%">Carga de energia y ki</button>
                        <button id="btn_semillas_ermt2" class="btn btn-success mb-3" style="width: 40%">Semillas de ermitaño (3)</button>
                </div>
                
            </div>
        </div>
        

    </div>  
    
    
    <script src="./bundle.js"></script>  
</body>
</html>
